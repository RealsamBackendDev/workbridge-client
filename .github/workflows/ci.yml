  build-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ../workbridge-client   # adjust once monorepo'd; for now use its own repo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build